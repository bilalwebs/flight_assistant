[project]
name = "flight-assistant-backend"
version = "1.0.0"
description = "AI Flight Booking & Travel Assistant — FastAPI backend with OpenAI Agents SDK"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "openai-agents",
    "openai",
    "pydantic>=2.0",
    "python-decouple",
    "aiosqlite",
    "sqlalchemy[asyncio]>=2.0",
    "httpx",
    "python-multipart",
    "asyncpg>=0.31.0",
    "alembic>=1.20.0",
    "email-validator>=2.0.0",
    "stripe>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio",
    "httpx",
]

[tool.pytest.ini_options]
testpaths = ["tests/test_isolation.py", "tests/test_config_validation.py"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.vercel]
entrypoint = "main:app"
