# Alembic configuration for Flight Assistant Backend.
# The database URL is supplied at runtime by alembic/env.py from the project's
# DATABASE_URL setting (see backend/config/settings.py) — never hardcode
# credentials here.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# URL is provided at runtime by env.py via config.settings.DATABASE_URL.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S